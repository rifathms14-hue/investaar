<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rushta Sign In</title><style>@font-face{font-family:Satoshi;font-weight:400;src:url(../assets/fonts/Satoshi-Regular.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts/Satoshi-Medium.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts/Satoshi-Bold.woff2) format("woff2")}@font-face{font-family:Rubik;font-weight:400;src:url(../assets/fonts/Rubik-Regular.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:500;src:url(../assets/fonts/Rubik-Medium.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:700;src:url(../assets/fonts/Rubik-Bold.ttf) format("truetype")}/* Sign in and verify. Mobile web is one column. Desktop is a brand panel and a form column, as in the wireframes.

:root{
  --forest:#03442D;--forest-hi:#055a3d;--emerald:#01BE84;--tint:#80DEC1;--ink:#090E0E;--mist:#F2F7F5;
  --sec:#E8F0EC;--sec-hi:#DAE6E1;--mute:#586863;--soft:#8DA099;--line:#BFCFC8;--white:#FFFFFF;--bg:#F3F8F6;
  --err:#A93226;--warn:#8A5A00;--ok:#0A6B47;--info:#1D5FA8;
  --f:Satoshi,Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid rgba(1,190,132,.55);outline-offset:2px}
.ic{display:inline-block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}.ltr{direction:ltr;unicode-bidi:isolate}

/* prototype bar, outside the product */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--mute);background:#fff}
.proto b{color:var(--ink);margin-inline-end:4px}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--mute)}
.seg button:hover{background:var(--sec)}
.seg button[aria-pressed=true]{background:var(--tint);color:var(--forest);font-weight:700}
.proto .hint{margin-inline-start:auto}

/* frame: lm = mobile web, ld = desktop */
.frame{position:relative;background:#fff;color:var(--ink);min-height:640px}
.frame.lm{width:100%;max-width:480px;margin:0 auto;min-height:calc(100vh - 54px);padding:0 max(20px,env(safe-area-inset-left,0px)) 32px max(20px,env(safe-area-inset-right,0px))}
.frame.ld{display:grid;grid-template-columns:minmax(380px,5fr) 7fr;min-height:calc(100vh - 54px)}
.panel{display:none}
.ld .panel{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:56px;color:#fff;background:radial-gradient(90% 60% at 20% 110%,rgba(128,222,193,.55),transparent 70%),radial-gradient(70% 50% at 100% 0,rgba(1,190,132,.35),transparent 70%),var(--forest)}
.panel .tag{font-size:40px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:0}.panel p{margin:14px 0 0;color:rgba(255,255,255,.82);font-size:16px;max-width:30ch}
.panel .clinic{font-size:15px;opacity:.85}
.main{display:flex;flex-direction:column;min-width:0}
.ld .main{justify-content:center;padding:56px 72px}
.ld .main>.in{width:100%;max-width:420px;margin:0 auto}
.rtl{direction:rtl;font-family:Rubik,Satoshi,sans-serif}
.rtl .num,.rtl input{font-family:Satoshi,Rubik,sans-serif}
.rtl h1,.rtl h2{letter-spacing:0;line-height:1.35}

.top{display:flex;align-items:center;gap:10px;padding-top:22px}
.ld .top{padding-top:0}
.lock{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--forest)}
.lock img{height:26px;display:block}
.ld .panel .lock{color:#fff;font-size:26px}.ld .panel .lock img{height:34px}
.ld .main .lock{display:none}
.step{display:flex;gap:6px;margin:16px 0 0}.step i{flex:1;height:4px;border-radius:2px;background:#E0E9E5}.step i.on{background:var(--emerald)}
.ld .step{margin:0 0 28px}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:28px 0 0}
.ld h1{font-size:34px;margin-top:0}
h2{font-size:18px;font-weight:700;margin:22px 0 4px}
.lead{color:var(--mute);margin:6px 0 0;max-width:46ch}

.lab{display:block;font-weight:700;font-size:14px;margin:24px 0 2px}.hint-t{display:block;color:var(--mute);font-size:13px;margin-bottom:8px}
.phone{display:flex;align-items:center;gap:0;height:56px;border:1.5px solid var(--line);border-radius:12px;background:transparent;direction:ltr;transition:background .15s,border-color .15s}
.phone:hover{border-color:var(--soft)}
.phone:focus-within{background:rgba(128,222,193,.28);border-color:var(--forest)}
.phone.bad{border-color:var(--err)}
.phone .cc{padding:0 14px;font-weight:700;border-inline-end:1.5px solid var(--line);height:28px;display:flex;align-items:center;color:var(--ink)}
.phone input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 14px;font-size:18px;letter-spacing:.02em;outline:0;font-variant-numeric:tabular-nums}
.phone input::placeholder{color:#8DA099}
.fieldmsg{display:flex;gap:6px;align-items:center;color:var(--err);font-size:13px;margin-top:8px}

.btn{width:100%;min-height:52px;padding:0 22px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--forest);color:#fff}.btn.p:hover{background:var(--forest-hi)}
.btn.s{background:var(--sec);color:var(--forest)}.btn.s:hover{background:var(--sec-hi)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btns.row{flex-direction:row}.btns.row .btn{flex:1;min-width:0;padding:0 12px;font-size:15px;white-space:nowrap;text-align:center;line-height:1.2}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.need{margin-top:30px;padding-top:4px}
.need b{display:block;font-size:15px}.need span{color:var(--mute)}
.langs{display:flex;gap:4px;margin-top:auto;padding-top:28px}
.ld .langs{margin-top:28px;padding-top:0}
.langs button{height:34px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--mute);font-weight:500}
.langs button:hover{background:var(--sec)}

.panel .langs button{color:rgba(255,255,255,.85)}.panel .langs button:hover{background:rgba(255,255,255,.12)}.panel .langs button[aria-pressed=true]{background:var(--tint);color:var(--forest)}

.cells{display:flex;gap:8px;margin-top:18px;direction:ltr}
.cell{flex:1;min-width:0;height:60px;border:1.5px solid var(--line);border-radius:12px;background:transparent;text-align:center;font-size:26px;font-weight:700;outline:0;padding:0;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}

.timer{font-weight:700;margin-top:20px;display:flex;align-items:center;gap:8px}
.timer .num{color:var(--forest)}
.links{color:var(--mute);margin-top:6px;font-size:14px}

.alert::after{content:"";position:absolute;inset:-7px;border-radius:18px;background:linear-gradient(120deg,var(--a1),var(--a2) 50%,var(--a3));filter:blur(14px);opacity:.38;z-index:-1;pointer-events:none}
.alert.warn{--a1:#F2A93B;--a2:#F7D56A;--a3:#FF9A6B}
.alert.ok{--a1:#16B37E;--a2:#80DEC1;--a3:#B7E85A}
.alert.info{--a1:#3E8BFF;--a2:#6FD0F2;--a3:#B79BFF}

.alert.warn .ico{background:rgba(242,169,59,.2);color:var(--warn)}.alert.ok .ico{background:rgba(22,179,126,.16);color:var(--ok)}.alert.info .ico{background:rgba(62,139,255,.14);color:var(--info)}

.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),380px);margin:0;z-index:40;background:#fff;animation:up .25s}
.scrim{position:fixed;inset:0;background:rgba(9,14,14,.42);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 24px),420px);background:#fff;border-radius:16px;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:31;animation:up .28s cubic-bezier(.2,.8,.2,1);text-align:center}

@keyframes fade{from{opacity:0}}
.end{max-width:420px;margin:48px auto;padding:20px;border-radius:16px;background:var(--sec);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* board of all screens */

.board h1{margin:6px 0 4px;font-size:26px}.board .lead{margin-bottom:22px}
.board h3{font-size:14px;margin:30px 0 12px;color:var(--mute);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.row-b{display:flex;flex-wrap:wrap;gap:20px;padding-bottom:12px;align-items:flex-start}
.fr{flex:none}.fr small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:700}
.fr .box{background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(3,68,45,.1)}
.fr .box .frame{min-height:0}
.fr.m .box{width:312px;height:675px}.fr.m .scale{width:390px;height:844px;transform:scale(.8);transform-origin:0 0}.fr.m .frame.lm{max-width:none;min-height:844px;height:844px;padding:0 20px 32px}

.in{display:flex;flex-direction:column;flex:1;min-height:0}
.ld .main>.in{flex:0 1 auto}
.lm .main{flex:1}

      h += '<h1>' + tt(s, 'title1') + '</h1><h2>' + tt(s, 'welcome') + '</h2><p class="lead" style="margin-top:0">' + tt(s, 'lead1') + '</p>';
      h += '<label class="lab" for="phone-' + u + '">' + tt(s, 'mobile') + '</label><span class="hint-t">' + tt(s, 'hint1') + '</span>';
      h += '<div class="phone' + (s.phoneErr ? ' bad' : '') + '"><span class="cc num">+966</span><input class="num" id="phone-' + u + '" data-phone type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="5X XXX XXXX" value="' + fmtPhone(d) + '" aria-describedby="phone-err-' + u + '"' + (s.phoneErr ? ' aria-invalid="true"' : '') + '></div>';
      h += '<div id="phone-err-' + u + '" aria-live="polite">' + (s.phoneErr ? '<div class="fieldmsg">' + ic('alert', 16) + tt(s, 'bad_phone') + '</div>' : '') + '</div>';
      h += '<div class="btns">' + busyBtn(s, tt(s, 'send'), 'send', 'send', ok, 'p') + '</div>';
      h += '<div class="need"><b>' + tt(s, 'need') + '</b><span>' + tt(s, 'need_s') + '</span></div>';
    } else if (s.screen === 'verify') {
      var full = s.code.join('').length === 6;
      h += '<h1>' + tt(s, 'title2') + '</h1><h2>' + tt(s, 'check') + '</h2><p class="lead" style="margin-top:0">' + tt(s, 'lead2') + ' <span class="ltr num">' + masked(d) + '</span>.</p>';
      h += cells(s, false, preset ? s.code.length : -1);
      h += '<div class="timer">' + ic('clock', 18) + '<span>' + tt(s, 'exp') + ' <span class="num" data-timer>' + clock(s.secs, s.lang) + '</span></span></div>';
      h += '<div class="btns">' + busyBtn(s, tt(s, 'verify'), 'verify', 'verify', full, 'p') + '<div class="btns row" style="margin:0">' +
        '<button class="btn s" data-act="resend" data-resend' + (s.cool > 0 ? ' disabled' : '') + '>' + (s.cool > 0 ? tt(s, 'resend_in') + ' <span class="num" data-cool>' + clock(s.cool, s.lang).replace(/^0/, '') + '</span>' : tt(s, 'resend')) + '</button>' +
        '<button class="btn s" data-act="change">' + tt(s, 'change') + '</button></div></div>';
    } else if (s.screen === 'wrong') {
      h += '<h1>' + tt(s, 'title3') + '</h1><h2>' + tt(s, 'check3') + '</h2><p class="lead" style="margin-top:0">' + tt(s, 'lead3') + '</p>';
      h += cells(s, true, -1) + alertBox('', 'alert', tt(s, 'a_bad'), tt(s, 'a_bad_s'));
      h += '<div class="btns"><button class="btn p" data-act="retry">' + tt(s, 'retry') + '</button><button class="btn s" data-act="change">' + tt(s, 'change_m') + '</button></div>';
    } else {
      h += '<h1>' + tt(s, 'title4') + '</h1><h2>' + tt(s, 'check4') + '</h2><p class="lead" style="margin-top:0">' + tt(s, 'lead4') + '</p>';
      h += alertBox('warn', 'clock', tt(s, 'a_exp'), tt(s, 'a_exp_s'));
      h += '<div class="btns"><button class="btn p" data-act="newcode">' + tt(s, 'newcode') + '</button><button class="btn s" data-act="change">' + tt(s, 'change') + '</button></div>';
    }
    return h;
  }
  function frame(s, mode, preset) {
    var ar = s.lang === 'ar';
    return '<div class="frame ' + mode + (ar ? ' rtl' : '') + '" dir="' + (ar ? 'rtl' : 'ltr') + '" lang="' + s.lang + '">' + (mode === 'ld' ? panel(s) : '') +
      '<main class="main"><div class="in">' + top(s) + body(s, preset) + (mode === 'lm' || preset ? langs(s, false) : langs(s, false)) + '</div></main></div>';
  }
  function sheet(s) {
    return '<div class="scrim" data-act="close"></div><div class="sheet" dir="' + (s.lang === 'ar' ? 'rtl' : 'ltr') + '" role="dialog" aria-modal="true" aria-label="' + tt(s, 'ok_t') + '"><div class="grab"></div><div class="badge">' + ic('check', 30) + '</div><h2>' + tt(s, 'ok_t') + '</h2><p>' + tt(s, 'ok_s') + '</p><div class="btns"><button class="btn p" data-act="continue">' + tt(s, 'cont') + '</button></div></div>';
  }

  /* ---------- live app ---------- */
  function layout() { return window.innerWidth >= 900 ? 'ld' : 'lm'; }
  function protoBar() {
    var scr = [['signin', 's1'], ['verify', 's2'], ['wrong', 's3'], ['expired', 's4']];
    return '<div class="proto"><b>Prototype</b><span class="seg" role="group" aria-label="Screen">' + scr.map(function (x) { return '<button data-act="go" data-v="' + x[0] + '" aria-pressed="' + (st.screen === x[0] && !st.ended) + '">' + S.en[x[1]].split(' ')[0] + '</button>'; }).join('') + '</span>' +
      '<span class="seg" role="group" aria-label="Language"><button data-act="lang" data-v="en" aria-pressed="' + (st.lang === 'en') + '">EN</button><button data-act="lang" data-v="ar" aria-pressed="' + (st.lang === 'ar') + '">ع</button></span>' +
      '<a href="#board" style="color:var(--forest);font-weight:700">All screens</a><span class="hint">Demo code ' + DEMO + '</span></div>';
  }
  function render() {
    var h = protoBar();
    if (st.ended) h += '<div class="end" dir="' + (st.lang === 'ar' ? 'rtl' : 'ltr') + '"><b>' + T('end_t') + '</b>' + T('end_s') + '<div class="btns"><button class="btn s" data-act="restart">' + T('again') + '</button></div></div>';
    else h += frame(st, layout(), false);
    h += st.sheet ? sheet(st) : '';
    h += st.toast ? '<div class="alert ok toast" role="status"><span class="ico">' + ic('check', 18) + '</span><div><b>' + T('sent') + '</b><span class="t">' + T('sent_s') + '</span></div></div>' : '';
    root.innerHTML = h;
  }
  function focusFirst() {
    var el = root.querySelector('[data-phone]') || root.querySelector('.cell:not(.filled)') || root.querySelector('.cell');
    if (el) el.focus();
  }
  function go(screen) { st.screen = screen; st.sheet = false; st.ended = false; st.busy = ''; if (screen === 'verify' && !st.phone) st.phone = '551001021'; render(); focusFirst(); }
  function showToast() { st.toast = '1'; clearTimeout(toastT); toastT = setTimeout(function () { st.toast = ''; var t = root.querySelector('.toast'); if (t) t.remove(); }, 2600); }
  function newCode() { st.secs = 299; st.cool = 30; st.code = []; st.screen = 'verify'; st.busy = ''; showToast(); render(); focusFirst(); }
  function tick() {
    if (st.ended || st.sheet) return;
    if (st.screen === 'verify' || st.screen === 'wrong') {
      st.secs--;
      if (st.secs <= 0) { st.secs = 0; st.screen = 'expired'; st.code = []; render(); return; }
      var el = root.querySelector('[data-timer]'); if (el) el.textContent = clock(st.secs, st.lang);
      if (st.cool > 0) {
        st.cool--;
        if (st.cool === 0) render(); else { var c = root.querySelector('[data-cool]'); if (c) c.textContent = clock(st.cool, st.lang).replace(/^0/, ''); }
      }
    }
  }
  function updateVerify() {
    var b = root.querySelector('[data-act=verify]'); if (b && !st.busy) b.disabled = st.code.join('').length !== 6;
    root.querySelectorAll('.cell').forEach(function (c, i) { c.classList.toggle('filled', !!st.code[i]); });
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var a = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (a === 'lang') { st.lang = v; render(); }
    else if (a === 'go') go(v);
    else if (a === 'send') {
      var d = digits(st.phone);
      if (!(d.length === 9 && d.charAt(0) === '5')) { st.phoneErr = true; render(); focusFirst(); return; }
      st.busy = 'send'; render(); setTimeout(function () { st.busy = ''; st.secs = 299; st.cool = 30; st.code = []; st.screen = 'verify'; render(); focusFirst(); }, 900);
    }
    else if (a === 'verify') {
      st.busy = 'verify'; render();
      setTimeout(function () {
        st.busy = '';
        if (st.code.join('') === DEMO) { st.sheet = true; render(); var b = root.querySelector('.sheet .btn'); if (b) b.focus(); }
        else { st.screen = 'wrong'; render(); var c = root.querySelector('.cells'); if (c) c.classList.add('shake'); var bt = root.querySelector('[data-act=retry]'); if (bt) bt.focus(); }
      }, 800);
    }
    else if (a === 'retry') { st.code = []; st.screen = 'verify'; render(); focusFirst(); }
    else if (a === 'resend') newCode();
    else if (a === 'newcode') newCode();
    else if (a === 'change') { st.screen = 'signin'; st.code = []; st.busy = ''; render(); focusFirst(); }
    else if (a === 'close') { st.sheet = false; render(); }
    else if (a === 'continue') { st.sheet = false; st.ended = true; render(); }
    else if (a === 'restart') { st.ended = false; st.screen = 'signin'; st.phone = ''; st.code = []; st.phoneErr = false; render(); focusFirst(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-phone')) {
      var d = digits(t.value).slice(0, 9); st.phone = d; t.value = fmtPhone(d);
      var ok = d.length === 9 && d.charAt(0) === '5'; var b = root.querySelector('[data-act=send]'); if (b) b.disabled = !ok;
      if (st.phoneErr && ok) { st.phoneErr = false; t.closest('.phone').classList.remove('bad'); var m = document.getElementById('phone-err-live'); if (m) m.innerHTML = ''; }
    } else if (t.classList && t.classList.contains('cell')) {
      var i = +t.getAttribute('data-i'), ds = digits(t.value);
      if (ds.length > 1) { for (var k = 0; k < ds.length && i + k < 6; k++) { st.code[i + k] = ds.charAt(k); var c = root.querySelector('.cell[data-i="' + (i + k) + '"]'); if (c) c.value = ds.charAt(k); } var nx = Math.min(5, i + ds.length); root.querySelector('.cell[data-i="' + nx + '"]').focus(); }
      else { st.code[i] = ds.charAt(0) || ''; t.value = ds.charAt(0) || ''; if (ds && i < 5) root.querySelector('.cell[data-i="' + (i + 1) + '"]').focus(); }
      for (var j = 0; j < 6; j++) if (st.code[j] === undefined) st.code[j] = '';
      updateVerify();
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('cell')) {
      var i = +t.getAttribute('data-i');
      if (e.key === 'Backspace' && !t.value && i > 0) { var p = root.querySelector('.cell[data-i="' + (i - 1) + '"]'); p.value = ''; st.code[i - 1] = ''; p.focus(); updateVerify(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' && i > 0) root.querySelector('.cell[data-i="' + (i - 1) + '"]').focus();
      else if (e.key === 'ArrowRight' && i < 5) root.querySelector('.cell[data-i="' + (i + 1) + '"]').focus();
      else if (e.key === 'Enter') { var v = root.querySelector('[data-act=verify]'); if (v && !v.disabled) v.click(); }
    } else if (t.hasAttribute && t.hasAttribute('data-phone') && e.key === 'Enter') { var s = root.querySelector('[data-act=send]'); if (s) s.click(); }
    else if (e.key === 'Escape' && st.sheet) { st.sheet = false; render(); }
  });
  window.addEventListener('resize', function () { if (!inBoard()) render(); });

  /* ---------- board of every screen ---------- */
  function inBoard() { return location.hash === '#board'; }
  function preset(lang, screen) {
    var o = { lang: lang, screen: screen, phone: '551001021', phoneErr: false, code: [], secs: 262, cool: 0, busy: '' };
    if (screen === 'signin') o.phone = '';
    if (screen === 'verify') o.code = ['4', '8', '2'];
    if (screen === 'wrong') o.code = ['4', '8', '2', '9', '1', '7'];
    return o;
  }
  function board() {
    var names = { en: ['A01 Sign in', 'A02 Verify your mobile number', 'A03 Code not recognised', 'A04 Code expired'], ar: ['A14 تسجيل الدخول', 'A15 التحقق من رقم الجوال', 'A03 رمز غير معروف (جديد)', 'A04 رمز منتهي (جديد)'] };
    var scr = ['signin', 'verify', 'wrong', 'expired'];
    function row(lang, mode, title) {
      var h = '<h3>' + title + '</h3><div class="row-b">';
      scr.forEach(function (sc, i) {
        var f = frame(preset(lang, sc), mode, true);
        h += '<div class="fr ' + (mode === 'lm' ? 'm' : 'd') + '"><small>' + names[lang][i] + '</small><div class="box" inert>' + (mode === 'ld' ? '<div class="scale">' + f + '</div>' : f) + '</div></div>';
      });
      return h + '</div>';
    }
    return '<div class="proto"><b>Prototype</b><a href="#" style="color:var(--forest);font-weight:700">Back to the live flow</a></div><div class="board"><h1>Sign in and verify</h1><p class="lead">Mobile web and desktop, English and Arabic. Arabic A03 and A04 are new translations for review.</p>' +
      row('en', 'lm', 'Mobile, English') + row('ar', 'lm', 'Mobile, Arabic') + row('en', 'ld', 'Desktop, English') + row('ar', 'ld', 'Desktop, Arabic') + '</div>';
  }
  function boot() { if (inBoard()) { clearInterval(tmr); root.innerHTML = board(); window.scrollTo(0, 0); } else { render(); focusFirst(); clearInterval(tmr); tmr = setInterval(tick, 1000); } }
  root = document.getElementById('app');
  window.addEventListener('hashchange', boot);
  boot();
})();
</script></body></html>
