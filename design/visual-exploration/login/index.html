<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rushta Sign In</title><style>@font-face{font-family:Satoshi;font-weight:400;src:url(../assets/fonts/Satoshi-Regular.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts/Satoshi-Medium.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts/Satoshi-Bold.woff2) format("woff2")}@font-face{font-family:Rubik;font-weight:400;src:url(../assets/fonts/Rubik-Regular.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:500;src:url(../assets/fonts/Rubik-Medium.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:700;src:url(../assets/fonts/Rubik-Bold.ttf) format("truetype")}/* Sign in and verify, second pass.
   Tokens: ink #02110C (main action, text), sage #D2DDCD (secondary action), paper #F5F8F3 (ground), mint #80DEC1 (selected), emerald #01BE84 (aurora only).
   One bold thing: the aurora, taken from the Login references. Everything else is quiet. Radius 16 at most except pills. */
:root{
  --ink:#02110C;--ink-hi:#0B2519;--sage:#D2DDCD;--sage-hi:#C5D3BF;--paper:#F5F8F3;--white:#FFFFFF;--mint:#80DEC1;--emerald:#01BE84;--forest:#03442D;
  --mute:#5B6A62;--soft:#8C9A92;--hair:rgba(2,17,12,.10);--err:#A8301F;--warn:#8A5A00;--ok:#0A6B47;--info:#1D5FA8;
  --sh:0 1px 2px rgba(2,17,12,.06),0 6px 20px rgba(2,17,12,.06);--sh-in:inset 0 1px 0 rgba(255,255,255,.14);
  --f:Satoshi,Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--emerald);outline-offset:2px}
.ic{display:inline-block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}.ltr{direction:ltr;unicode-bidi:isolate}

/* prototype strip, not part of the product */
.proto{display:flex;flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;align-items:center;gap:6px 14px;height:38px;padding:0 max(16px,env(safe-area-inset-left,0px));font-size:12px;color:#9FB0A7;background:var(--ink)}
.proto b{color:#fff;font-weight:700}
.proto a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.pseg{display:inline-flex;gap:2px}
.pseg button{height:26px;padding:0 10px;border-radius:999px;color:#9FB0A7;font-size:12px;font-weight:500}
.pseg button:hover{color:#fff}.pseg button[aria-pressed=true]{background:var(--mint);color:var(--ink);font-weight:700}
.proto .hint{margin-inline-start:auto}

/* frames: lm is mobile web, ld is desktop */
.frame{position:relative;background:var(--paper);color:var(--ink);overflow:hidden}
.frame.lm{display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;min-height:calc(100svh - 38px)}
.frame.ld{display:grid;grid-template-columns:minmax(420px,5fr) 7fr;min-height:calc(100svh - 38px)}
.rtl{direction:rtl;font-family:Rubik,Satoshi,sans-serif}
.rtl .num,.rtl input{font-family:Satoshi,Rubik,sans-serif}
.aurora{position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(55% 60% at 88% -8%,rgba(1,190,132,.34),transparent 72%),radial-gradient(60% 55% at 6% -4%,rgba(128,222,193,.6),transparent 70%),radial-gradient(40% 40% at 55% 0,rgba(214,236,180,.55),transparent 72%);
  animation:glow .9s ease-out both}
@keyframes glow{from{opacity:0}}

.bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0;min-height:64px}
.ld .bar{padding:28px 56px 0}
.lock{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.015em}
.lock img{height:24px;display:block}
.round{width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.round:active{transform:scale(.94)}
.toggle{display:inline-flex;background:rgba(2,17,12,.06);border-radius:999px;padding:3px}
.toggle button{height:30px;min-width:38px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mute)}
.toggle button[aria-pressed=true]{background:var(--mint);color:var(--ink);font-weight:700}

.stage{position:relative;z-index:1;padding:28px 20px 0}
.ld .side{position:relative;display:flex;flex-direction:column;min-width:0}
.ld .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 56px 56px}
.ld .col{width:100%;max-width:400px;margin:0 auto}
h1{margin:0;font-size:36px;line-height:1.04;font-weight:500;letter-spacing:-.035em;text-wrap:balance;animation:rise .5s .05s ease-out both}
.ld h1{font-size:40px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rtl h1{letter-spacing:0;line-height:1.3;font-weight:500}
.lead{margin:14px 0 0;color:var(--mute);max-width:36ch;text-wrap:pretty}
.lead .ltr{color:var(--ink);font-weight:500}

.field{margin-top:32px}
.field>label{display:block;font-size:14px;font-weight:500;margin-bottom:10px}
.phone{display:flex;align-items:center;height:64px;border-radius:14px;background:var(--white);box-shadow:var(--sh);direction:ltr;transition:box-shadow .15s,background .15s}
.phone:focus-within,.phone.on{box-shadow:0 0 0 2px var(--ink),var(--sh)}
.phone.bad{box-shadow:0 0 0 2px var(--err),var(--sh)}
.phone .cc{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:20px;font-weight:500;height:30px;border-inline-end:1px solid var(--hair)}
.phone input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 16px;font-size:22px;font-weight:500;letter-spacing:.01em;outline:0;caret-color:var(--emerald)}
.phone input::placeholder{color:#B6C1BA}
.helper{margin:10px 2px 0;font-size:13px;color:var(--mute)}
.err{display:flex;gap:6px;align-items:center;color:var(--err);font-size:13px;margin:10px 2px 0}
.note{margin:22px 0 0;color:var(--mute);font-size:14px}.note b{color:var(--ink);font-weight:500}

/* code boxes: white with soft shadow, active box ringed */
.codewrap{position:relative;margin-top:32px;direction:ltr}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{height:64px;border-radius:12px;background:var(--white);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;transition:box-shadow .15s,background .15s}
.cell.act{box-shadow:0 0 0 2px var(--ink),var(--sh);background:rgba(128,222,193,.28)}
.cells.bad .cell{box-shadow:0 0 0 1.5px rgba(168,48,31,.7),var(--sh)}
.cell .caret{width:2px;height:26px;background:var(--emerald);border-radius:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.codein{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px;cursor:text;caret-color:transparent}
.meta{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--mute);font-size:14px}
.meta .num{color:var(--ink);font-weight:500}
.ring{width:20px;height:20px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:2.5}.ring .tr{stroke:rgba(2,17,12,.10)}.ring .pr{stroke:var(--emerald);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* buttons */
.btn{width:100%;min-height:56px;padding:0 24px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.005em;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--ink);color:#fff;box-shadow:var(--sh-in),0 6px 16px rgba(2,17,12,.18)}.btn.p:hover{background:var(--ink-hi)}
.btn.s{background:var(--sage);color:var(--ink)}.btn.s:hover{background:var(--sage-hi)}
.btn.sm{width:auto;min-height:44px;padding:0 18px;font-size:14px;font-weight:700}
.btn[disabled]{cursor:not-allowed;box-shadow:none;transform:none}
.btn.p[disabled]{background:#DCE4D8;color:#8C9A92}
.btn.s[disabled]{background:#E6ECE2;color:#9AA89F}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.acts{display:flex;flex-direction:column;gap:10px}
.ld .acts{margin-top:28px}

/* bottom dock on mobile: action then pad */
.dock{position:relative;z-index:1;margin-top:auto;padding-top:18px}
.dock .acts{padding:0 20px 16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(210,221,205,.62);border-radius:16px 16px 0 0;direction:ltr}
.key{height:52px;border-radius:10px;background:var(--white);box-shadow:0 1px 0 rgba(2,17,12,.14);font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .08s,transform .08s}
.key:active{background:var(--sage);transform:scale(.97)}
.key.x{background:transparent;box-shadow:none}.key.x:active{background:rgba(2,17,12,.08)}
.key small{display:none}

/* alert with aurora edges */
.alert{--a1:#E5484D;--a2:#FF9A6B;--a3:#F2B8D2;position:relative;isolation:isolate;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--white);margin-top:26px}
.alert::before{content:"";position:absolute;inset:0;border-radius:12px;padding:1.5px;background:linear-gradient(115deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);z-index:1;pointer-events:none}
.alert::after{content:"";position:absolute;inset:-6px;border-radius:18px;background:linear-gradient(115deg,var(--a1),var(--a2) 55%,var(--a3));filter:blur(16px);opacity:.34;z-index:-1;pointer-events:none}
.alert.warn{--a1:#F2A93B;--a2:#F7D56A;--a3:#FF9A6B}.alert.ok{--a1:#16B37E;--a2:#80DEC1;--a3:#B7E85A}
.alert .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(229,72,77,.11);color:var(--err)}
.alert.warn .ico{background:rgba(242,169,59,.2);color:var(--warn)}.alert.ok .ico{background:rgba(22,179,126,.16);color:var(--ok)}
.alert b{display:block;font-size:15px;font-weight:700;line-height:1.3}.alert .t{color:var(--mute);font-size:14px;line-height:1.4}
.shake{animation:shk .36s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* toast, sheet */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),380px);margin:0;z-index:40;animation:up .3s}
.scrim{position:fixed;inset:0;background:rgba(2,17,12,.46);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 24px),420px);background:var(--white);border-radius:16px;padding:12px 24px calc(22px + env(safe-area-inset-bottom,0px));z-index:31;animation:up .32s cubic-bezier(.2,.8,.2,1);text-align:center}
.grab{width:40px;height:4px;border-radius:2px;background:#D6E0DA;margin:0 auto 22px}
.badge{width:68px;height:68px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative}
.badge svg.bg{position:absolute;inset:0}
.sheet h2{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.02em}.sheet p{margin:0 0 22px;color:var(--mute)}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}}
.end{max-width:420px;margin:56px auto;padding:24px;border-radius:16px;background:var(--sage);text-align:center}.end b{display:block;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* left panel on desktop */
.panel{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:28px 56px 56px;color:#fff;background:var(--ink);overflow:hidden}
.panel::before{content:"";position:absolute;inset:auto -20% -30% -20%;height:70%;background:radial-gradient(50% 60% at 30% 70%,rgba(1,190,132,.55),transparent 70%),radial-gradient(40% 50% at 75% 85%,rgba(128,222,193,.4),transparent 70%);filter:blur(30px);pointer-events:none}
.panel>*{position:relative}
.panel .lock{font-size:22px}.panel .lock img{height:28px}
.panel .clinic{font-size:15px;color:rgba(255,255,255,.62);margin-bottom:14px}
.panel .tag{margin:0;font-size:56px;line-height:1.02;font-weight:500;letter-spacing:-.04em;max-width:9ch;text-wrap:balance}
.rtl .panel .tag{letter-spacing:0;line-height:1.25;max-width:none}
.panel p{margin:20px 0 0;color:rgba(255,255,255,.7);max-width:30ch}

/* board */
.board{padding:20px max(16px,env(safe-area-inset-left,0px)) 60px;background:#E4EAE0}
.board h1{font-size:26px;animation:none;margin:6px 0 4px;letter-spacing:-.02em}.board .lead{margin:0 0 20px}
.board h3{font-size:13px;margin:30px 0 12px;color:var(--mute);font-weight:700}
.row-b{display:flex;flex-wrap:wrap;gap:20px;padding-bottom:12px;align-items:flex-start}
.fr{flex:none}.fr small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:700}
.fr .box{background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(2,17,12,.1)}
.fr.m .box{width:312px;height:675px}.fr.m .scale{width:390px;height:844px;transform:scale(.8);transform-origin:0 0}.fr.m .frame.lm{max-width:none;min-height:844px;height:844px}
.fr.d .box{width:720px;height:450px}.fr.d .scale{width:1440px;height:900px;transform:scale(.5);transform-origin:0 0}.fr.d .frame.ld{min-height:900px;height:900px}
.fr [inert]{pointer-events:none}
.rtl .dir{transform:scaleX(-1)}
.cell.act{box-shadow:var(--sh);background:var(--white)}
.codewrap:focus-within .cell.act,.pre .cell.act{box-shadow:0 0 0 2px var(--ink),var(--sh);background:rgba(128,222,193,.28)}
.cell .caret{display:none}.codewrap:focus-within .caret,.pre .caret{display:block}
.cells.bad .cell.act{box-shadow:0 0 0 1.5px rgba(168,48,31,.7),var(--sh)}
.lead .ltr{white-space:nowrap}

  function phoneOk(d) { return d.length === 9 && d.charAt(0) === '5'; }

  /* ---------- markup ---------- */
  function lockup(s, rev) { return '<span class="lock"><img src="' + (rev ? MARK_R : MARK_C) + '" alt="">' + (s.lang === 'ar' ? 'رُشتة' : 'Rushta') + '</span>'; }
  function toggle(s) { return '<span class="toggle" role="group" aria-label="' + tt(s, 'lang') + '"><button data-act="lang" data-v="en" aria-pressed="' + (s.lang === 'en') + '">EN</button><button data-act="lang" data-v="ar" aria-pressed="' + (s.lang === 'ar') + '" lang="ar">ع</button></span>'; }
  function backBtn(s) { return '<button class="round" data-act="change" aria-label="' + tt(s, 'back') + '">' + ic('back', 20, 'dir') + '</button>'; }
  function alertBox(cls, icon, title, text) { return '<div class="alert ' + cls + '" role="alert"><span class="ico">' + ic(icon, 17) + '</span><div><b>' + title + '</b><span class="t">' + text + '</span></div></div>'; }
  function cells(s, bad, pre) {
    var v = s.code, act = Math.min(v.length, 5), h = '<div class="cells' + (bad ? ' bad' : '') + '" data-cells>';
    for (var i = 0; i < 6; i++) h += cell(i, v, act, bad);
    return h + '</div>';
  }
  function cell(i, v, act, bad) { var d = v.charAt(i); return '<div class="cell num' + (i === act && !bad ? ' act' : '') + '">' + (d || (i === act && !bad ? '<i class="caret"></i>' : '')) + '</div>'; }
  function btn(s, cls, act, label, enabled, busyKey) {
    var busy = busyKey && s.busy === busyKey;
    return '<button class="btn ' + cls + '" data-act="' + act + '"' + (enabled && !s.busy ? '' : ' disabled') + '>' + (busy ? '<span class="spin" aria-hidden="true"></span>' + tt(s, busyKey === 'send' ? 'sending' : 'verifying') : label) + '</button>';
  }
  function pad(s) {
    var h = '<div class="pad" role="group" aria-label="' + tt(s, 'pad') + '">';
    '123456789'.split('').forEach(function (k) { h += '<button class="key num" data-key="' + k + '">' + k + '</button>'; });
    return h + '<span></span><button class="key num" data-key="0">0</button><button class="key x" data-key="del" aria-label="' + tt(s, 'del') + '">' + ic('del', 24) + '</button></div>';
  }
  function view(s, mode, pre) {
    var d = digits(s.phone), u = pre ? 'b' + (++UID) : 'live', v = { back: s.screen !== 'signin', mid: '', acts: '', pad: false };
    if (s.screen === 'signin') {
      v.title = tt(s, 'title1'); v.lead = tt(s, 'lead1');
      v.mid = '<div class="field"><label for="phone-' + u + '">' + tt(s, 'mobile') + '</label><div class="phone' + (s.phoneErr ? ' bad' : '') + (pre ? ' on' : '') + '"><span class="cc num">+966</span><input class="num" id="phone-' + u + '" data-phone type="tel" ' + (mode === 'lm' ? 'inputmode="none"' : 'inputmode="numeric"') + ' autocomplete="tel-national" placeholder="5X XXX XXXX" value="' + fmtPhone(d) + '" aria-describedby="hint-' + u + '"' + (s.phoneErr ? ' aria-invalid="true"' : '') + '></div>' +
        '<div id="hint-' + u + '" aria-live="polite">' + (s.phoneErr ? '<div class="err">' + ic('alert', 15) + tt(s, 'bad_phone') + '</div>' : '<p class="helper">' + tt(s, 'hint1') + '</p>') + '</div></div>' +
        '<p class="note"><b>' + tt(s, 'need') + '</b> ' + tt(s, 'need_s') + '</p>';
      v.acts = btn(s, 'p', 'send', tt(s, 'send'), phoneOk(d), 'send'); v.pad = true;
    } else if (s.screen === 'verify') {
      var cd = s.cool > 0;
      v.title = tt(s, 'title2'); v.leadHtml = tt(s, 'lead2') + ' <span class="ltr num">' + masked(d) + '</span>.';
      v.mid = '<div class="codewrap' + (pre ? ' pre' : '') + '">' + cells(s, false, pre) + '<input class="codein num" data-code type="text" ' + (mode === 'lm' ? 'inputmode="none"' : 'inputmode="numeric"') + ' autocomplete="one-time-code" maxlength="6" value="' + s.code + '" aria-label="' + tt(s, 'code_label') + '"></div>' +
        '<div class="meta"><svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="tr" cx="10" cy="10" r="8"/><circle class="pr" data-ring cx="10" cy="10" r="8" stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + (CIRC * (1 - s.secs / 299)).toFixed(2) + '"/></svg><span>' + tt(s, 'exp') + ' <span class="num ltr" data-timer>' + clock(s.secs, s.lang) + '</span></span></div>' +
        '<div class="chips"><button class="btn s sm" data-act="resend"' + (cd ? ' disabled' : '') + '>' + (cd ? tt(s, 'resend_in') + ' <span class="num ltr" data-cool>' + clock(s.cool, s.lang).replace(/^0/, '') + '</span>' : tt(s, 'resend')) + '</button><button class="btn s sm" data-act="change">' + tt(s, 'change') + '</button></div>';
      v.acts = btn(s, 'p', 'verify', tt(s, 'verify'), s.code.length === 6, 'verify'); v.pad = true;
    } else if (s.screen === 'wrong') {
      v.title = tt(s, 'title3'); v.lead = tt(s, 'lead3');
      v.mid = '<div class="codewrap">' + cells(s, true, pre) + '</div>' + alertBox('', 'alert', tt(s, 'a_bad'), tt(s, 'a_bad_s'));
      v.acts = btn(s, 'p', 'retry', tt(s, 'retry'), true) + btn(s, 's', 'change', tt(s, 'change_m'), true);
    } else {
      v.title = tt(s, 'title4'); v.lead = tt(s, 'lead4');
      v.mid = alertBox('warn', 'clock', tt(s, 'a_exp'), tt(s, 'a_exp_s'));
      v.acts = btn(s, 'p', 'newcode', tt(s, 'newcode'), true) + btn(s, 's', 'change', tt(s, 'change'), true);
    }
    return v;
  }
  function frame(s, mode, pre) {
    var ar = s.lang === 'ar', v = view(s, mode, pre), lead = '<p class="lead">' + (v.leadHtml || v.lead) + '</p>';
    var head = '<h1>' + v.title + '</h1>' + lead + v.mid, h = '<div class="frame ' + mode + (ar ? ' rtl' : '') + '" dir="' + (ar ? 'rtl' : 'ltr') + '" lang="' + s.lang + '">';
    if (mode === 'ld') {
      h += '<aside class="panel">' + lockup(s, true) + '<div><div class="clinic">' + tt(s, 'clinic') + '</div><h2 class="tag">' + tt(s, 'tag') + '</h2><p>' + tt(s, 'panel_s') + '</p></div></aside>' +
        '<section class="side"><div class="aurora"></div><header class="bar"><span>' + (v.back ? backBtn(s) : '') + '</span>' + toggle(s) + '</header><main class="stage"><div class="col">' + head + '<div class="acts">' + v.acts + '</div></div></main></section>';
    } else {
      h += '<div class="aurora"></div><header class="bar">' + (v.back ? backBtn(s) : lockup(s, false)) + toggle(s) + '</header><main class="stage">' + head + '</main><div class="dock"><div class="acts">' + v.acts + '</div>' + (v.pad ? pad(s) : '') + '</div>';
    }
    return h + '</div>';
  }
  function sheet(s) {
    return '<div class="scrim" data-act="close"></div><div class="sheet" dir="' + (s.lang === 'ar' ? 'rtl' : 'ltr') + '" role="dialog" aria-modal="true" aria-label="' + tt(s, 'ok_t') + '"><div class="grab"></div><div class="badge">' + scallop() + ic('check', 32) + '</div><h2>' + tt(s, 'ok_t') + '</h2><p>' + tt(s, 'ok_s') + '</p><button class="btn p" data-act="continue">' + tt(s, 'cont') + '</button></div>';
  }

  /* ---------- live app ---------- */
  function layout() { return window.innerWidth >= 900 ? 'ld' : 'lm'; }
  function protoBar() {
    var scr = [['signin', 's1'], ['verify', 's2'], ['wrong', 's3'], ['expired', 's4']];
    return '<div class="proto"><b>' + (st.screen === 'verify' ? 'Demo code ' + DEMO : 'Prototype') + '</b><span class="pseg" role="group" aria-label="Screen">' + scr.map(function (x) { return '<button data-act="go" data-v="' + x[0] + '" aria-pressed="' + (st.screen === x[0] && !st.ended) + '">' + S.en[x[1]] + '</button>'; }).join('') + '</span>' +
      '<a href="#board">All screens</a></div>';
  }
  function render() {
    var h = protoBar();
    if (st.ended) h += '<div class="end" dir="' + (st.lang === 'ar' ? 'rtl' : 'ltr') + '"><b>' + T('end_t') + '</b>' + T('end_s') + '<div class="acts" style="margin-top:16px"><button class="btn s" data-act="restart">' + T('again') + '</button></div></div>';
    else h += frame(st, layout(), false);
    h += st.sheet ? sheet(st) : '';
    h += st.toast ? '<div class="alert ok toast" role="status"><span class="ico">' + ic('check', 17) + '</span><div><b>' + T('sent') + '</b><span class="t">' + T('sent_s') + '</span></div></div>' : '';
    root.innerHTML = h;
  }
  function field() { return root.querySelector('[data-phone]') || root.querySelector('[data-code]'); }
  function focusField() { var f = field(); if (f && !st.sheet) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } } }
  function go(screen) { st.screen = screen; st.sheet = false; st.ended = false; st.busy = ''; if (screen === 'verify') { if (!st.phone) st.phone = '551001021'; } render(); focusField(); }
  function showToast() { st.toast = '1'; clearTimeout(toastT); toastT = setTimeout(function () { st.toast = ''; var t = root.querySelector('.toast'); if (t) t.remove(); }, 2600); }
  function newCode() { st.secs = 299; st.cool = 30; st.code = ''; st.screen = 'verify'; st.busy = ''; showToast(); render(); focusField(); }
  function syncPhone() {
    var d = digits(st.phone), i = root.querySelector('[data-phone]'), b = root.querySelector('[data-act=send]');
    if (i) i.value = fmtPhone(d); if (b && !st.busy) b.disabled = !phoneOk(d);
    if (st.phoneErr && phoneOk(d)) { st.phoneErr = false; render(); focusField(); }
  }
  function syncCode() {
    var w = root.querySelector('[data-cells]'), i = root.querySelector('[data-code]'), b = root.querySelector('[data-act=verify]');
    if (i && i.value !== st.code) i.value = st.code;
    if (w) { var act = Math.min(st.code.length, 5), h = ''; for (var k = 0; k < 6; k++) h += cell(k, st.code, act, false); w.innerHTML = h; }
    if (b && !st.busy) b.disabled = st.code.length !== 6;
  }
  function press(k) {
    if (st.screen === 'signin') { var d = digits(st.phone); d = k === 'del' ? d.slice(0, -1) : (d.length < 9 ? d + k : d); st.phone = d; syncPhone(); }
    else if (st.screen === 'verify') { st.code = k === 'del' ? st.code.slice(0, -1) : (st.code.length < 6 ? st.code + k : st.code); syncCode(); }
  }
  function tick() {
    if (st.ended || st.sheet) return;
    if (st.screen === 'verify' || st.screen === 'wrong') {
      st.secs--;
      if (st.secs <= 0) { st.secs = 0; st.screen = 'expired'; st.code = ''; render(); return; }
      var el = root.querySelector('[data-timer]'); if (el) el.textContent = clock(st.secs, st.lang);
      var rg = root.querySelector('[data-ring]'); if (rg) rg.setAttribute('stroke-dashoffset', (CIRC * (1 - st.secs / 299)).toFixed(2));
      if (st.cool > 0) { st.cool--; if (st.cool === 0) { render(); focusField(); } else { var c = root.querySelector('[data-cool]'); if (c) c.textContent = clock(st.cool, st.lang).replace(/^0/, ''); } }
    }
  }
  document.addEventListener('mousedown', function (e) { if (e.target.closest('[data-key]')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var kb = e.target.closest('[data-key]'); if (kb) { press(kb.getAttribute('data-key')); return; }
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var a = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (a === 'lang') { st.lang = v; render(); focusField(); }
    else if (a === 'go') go(v);
    else if (a === 'send') {
      var d = digits(st.phone);
      if (!phoneOk(d)) { st.phoneErr = true; render(); focusField(); return; }
      st.busy = 'send'; render();
      setTimeout(function () { st.busy = ''; st.secs = 299; st.cool = 30; st.code = ''; st.screen = 'verify'; render(); focusField(); }, 900);
    }
    else if (a === 'verify') {
      st.busy = 'verify'; render();
      setTimeout(function () {
        st.busy = '';
        if (st.code === DEMO) { st.sheet = true; render(); var b = root.querySelector('.sheet .btn'); if (b) b.focus(); }
        else { st.screen = 'wrong'; render(); var c = root.querySelector('.cells'); if (c) c.classList.add('shake'); var bt = root.querySelector('[data-act=retry]'); if (bt) bt.focus(); }
      }, 800);
    }
    else if (a === 'retry') { st.code = ''; st.screen = 'verify'; render(); focusField(); }
    else if (a === 'resend' || a === 'newcode') newCode();
    else if (a === 'change') { st.screen = 'signin'; st.code = ''; st.busy = ''; render(); focusField(); }
    else if (a === 'close') { st.sheet = false; render(); }
    else if (a === 'continue') { st.sheet = false; st.ended = true; render(); }
    else if (a === 'restart') { st.ended = false; st.screen = 'signin'; st.phone = ''; st.code = ''; st.phoneErr = false; render(); focusField(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-phone')) { st.phone = digits(t.value).slice(0, 9); syncPhone(); }
    else if (t.hasAttribute && t.hasAttribute('data-code')) { st.code = digits(t.value).slice(0, 6); syncCode(); }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && t.hasAttribute && (t.hasAttribute('data-phone') || t.hasAttribute('data-code'))) { var b = root.querySelector('[data-act=send],[data-act=verify]'); if (b && !b.disabled) b.click(); }
    else if (e.key === 'Escape' && st.sheet) { st.sheet = false; render(); }
  });
  window.addEventListener('resize', function () { if (!inBoard()) { render(); } });

  /* ---------- every screen on one board ---------- */
  function inBoard() { return location.hash === '#board'; }
  function preset(lang, screen) {
    var o = { lang: lang, screen: screen, phone: '551001021', phoneErr: false, code: '', secs: 262, cool: 0, busy: '' };
    if (screen === 'signin') o.phone = '';
    if (screen === 'verify') o.code = '482';
    if (screen === 'wrong') o.code = '482917';
    return o;
  }
  function board() {
    var names = { en: ['A01 Sign in', 'A02 Verify your mobile number', 'A03 Code not recognised', 'A04 Code expired'], ar: ['A14 تسجيل الدخول', 'A15 التحقق من رقم الجوال', 'A03 رمز غير معروف (جديد)', 'A04 رمز منتهي (جديد)'] };
    var scr = ['signin', 'verify', 'wrong', 'expired'];
    function row(lang, mode, title) {
      var h = '<h3>' + title + '</h3><div class="row-b">';
      scr.forEach(function (sc, i) { h += '<div class="fr ' + (mode === 'lm' ? 'm' : 'd') + '"><small>' + names[lang][i] + '</small><div class="box" inert><div class="scale">' + frame(preset(lang, sc), mode, true) + '</div></div></div>'; });
      return h + '</div>';
    }
    return '<div class="proto"><b>Prototype</b><a href="#">Back to the live flow</a></div><div class="board"><h1>Sign in and verify</h1><p class="lead">Mobile web and desktop, English and Arabic. Arabic A03 and A04 are new translations for review.</p>' +
      row('en', 'lm', 'Mobile, English') + row('ar', 'lm', 'Mobile, Arabic') + row('en', 'ld', 'Desktop, English') + row('ar', 'ld', 'Desktop, Arabic') + '</div>';
  }
  function boot() { clearInterval(tmr); if (inBoard()) { root.innerHTML = board(); window.scrollTo(0, 0); } else { render(); focusField(); tmr = setInterval(tick, 1000); } }
  root = document.getElementById('app');
  window.addEventListener('hashchange', boot);
  boot();
})();
</script></body></html>
