<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rushta App</title><style>@font-face{font-family:Satoshi;font-weight:400;src:url(../assets/fonts/Satoshi-Regular.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts/Satoshi-Medium.woff2) format("woff2")}@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts/Satoshi-Bold.woff2) format("woff2")}@font-face{font-family:Rubik;font-weight:400;src:url(../assets/fonts/Rubik-Regular.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:500;src:url(../assets/fonts/Rubik-Medium.ttf) format("truetype")}@font-face{font-family:Rubik;font-weight:700;src:url(../assets/fonts/Rubik-Bold.ttf) format("truetype")}/* One-column mobile app. A: calm headline and progress. C: chips, cards, Arabic RTL. E: dashboard numbers, dark pill nav. */
:root{

  --shadow:0 1px 2px rgba(3,68,45,.05),0 10px 28px rgba(3,68,45,.07);
  --f:Satoshi,Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.stage{display:flex;justify-content:center;min-height:100vh}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;padding-block:0 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(90% 320px at 85% 0,rgba(128,222,193,.45),transparent 70%),linear-gradient(#F4F9F7,#F6FAF9 420px)}
@media (min-width:480px){.app{box-shadow:0 0 0 1px rgba(3,68,45,.05),0 30px 80px rgba(3,68,45,.1)}}
.ic{display:inline-block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
[dir=rtl] .dir{transform:scaleX(-1)}
:focus-visible{outline:3px solid rgba(1,190,132,.55);outline-offset:2px}

/* prototype bar, not part of the product */
.proto{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 0;font-size:12px;color:var(--mute)}
.seg2{display:inline-flex;background:rgba(3,68,45,.07);border-radius:999px;padding:3px}
.seg2 button{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--mute)}
.seg2 button[aria-pressed=true]{background:#fff;color:var(--forest);font-weight:700;box-shadow:0 1px 4px rgba(3,68,45,.12)}

.hdr{display:flex;align-items:center;gap:12px;padding-top:16px}
.hdr .who{flex:1;min-width:0}.hdr .who small{display:block;color:var(--mute);font-size:13px}.hdr .who b{font-size:17px}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(140deg,#0c5a3e,var(--forest));flex:none}
.av.l{background:linear-gradient(140deg,#CFEFE3,#8FD9BF);color:var(--forest)}
.av.g{background:linear-gradient(140deg,#EEF3F1,#CFDCD7);color:var(--forest)}
.cb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sec);color:var(--forest);flex:none;transition:background .15s}
.cb:hover{background:var(--sec-hi)}.cb.w{background:#fff;box-shadow:var(--shadow)}
.title{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:22px 0 14px}
.eyebrow{color:var(--mute);font-size:13px}
.hl{font-size:34px;line-height:1.12;font-weight:500;letter-spacing:-.012em;margin:8px 0 0}
.hl .m{color:var(--soft)}
[dir=rtl] .hl{line-height:1.35;letter-spacing:0}

.btn{min-height:52px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active,.chip:active,.cb:active{transform:scale(.97)}
.btn.p{background:var(--forest);color:#fff}.btn.p:hover{background:var(--forest-hi)}
.btn.s{background:var(--sec);color:var(--forest)}.btn.s:hover{background:var(--sec-hi)}
.btn.sm{min-height:46px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:10px;align-items:center}.row2>.btn{flex:1}.row2>.btn.f2{flex:1.5}

.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:18px}.mt2{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}.sec-h h2{font-size:19px;margin:0;font-weight:700}.sec-h a,.sec-h button{color:var(--mute);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--badge);color:var(--forest);font-size:12px;font-weight:700;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--emerald)}
.badge.q{background:var(--sec);color:var(--mute)}.badge.q i{background:var(--soft)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-block:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;font-weight:500;font-size:15px;background:var(--sec);color:var(--ink);white-space:nowrap;transition:background .15s}
.chip:hover{background:var(--sec-hi)}.chip[aria-pressed=true]{background:var(--forest);color:#fff;font-weight:700}
.chip.slot{height:42px;padding:0 16px;font-size:14px}.chip[disabled]{background:#F0F4F2;color:#A9B7B2;cursor:not-allowed}

/* progress, from A */
.steps{display:flex;gap:4px;margin-top:18px}
.steps i{flex:1;height:34px;border-radius:7px;background:repeating-linear-gradient(135deg,#DCE6E2 0 2px,#fff 2px 7px)}
.steps i.d1{background:linear-gradient(90deg,#B5F0DB,var(--tint))}.steps i.d2{background:linear-gradient(90deg,#4FD3A6,var(--emerald))}
.steplab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.rxtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rxtop h3{font-size:21px;font-weight:500;margin:0}.rxtop p{margin:4px 0 0;color:var(--mute);font-size:13px}
.facts{display:flex;gap:26px;margin-top:18px;font-size:12px;color:var(--mute)}.facts b{display:block;color:var(--ink);font-size:14px;margin-top:3px}

/* bento numbers, from E */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:10px}.num small{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0}
.stat .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.stat .d{font-size:11px;color:var(--forest)}.stat .d.dn{color:var(--mute)}
.stat .sub{color:var(--mute);font-size:11.5px;margin-top:2px}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:6px 0 0;font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;border-radius:3px;background:#E1EAE6;margin-top:16px}.track b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px;background:linear-gradient(90deg,var(--tint),var(--emerald))}.track u{position:absolute;top:-8px;width:3px;height:22px;border-radius:2px;background:var(--forest)}
.invite{display:flex;align-items:center;gap:14px;border-radius:26px;background:linear-gradient(120deg,#E3F5EE,#F3FAF7 60%,#fff);padding:16px 18px}.invite p{margin:5px 0 0;color:var(--mute);font-size:12.5px;line-height:1.45}
.glyph{width:66px;height:66px;border-radius:22px;background:linear-gradient(145deg,#7CF0C8,var(--emerald) 55%,var(--forest));display:flex;align-items:center;justify-content:center;box-shadow:0 14px 26px rgba(1,190,132,.38);transform:rotate(8deg);flex:none}

/* lists, from C */
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .1s}
.item:active{transform:scale(.99)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .t span{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.item .e{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px}
.rxc{display:block;width:100%;text-align:start;background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.rxc .l{display:flex;justify-content:space-between;align-items:center}
.rxc h3{font-size:17px;font-weight:700;margin:12px 0 2px}.rxc p{margin:0;color:var(--mute);font-size:13px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--sec);border-radius:22px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--forest);min-width:0}
.tile b{color:var(--ink);font-size:14px}.tile span{color:var(--mute);font-size:11.5px}
.empty{text-align:center;color:var(--mute);padding:34px 20px;border-radius:26px;background:rgba(255,255,255,.6)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.back{display:flex;align-items:center;justify-content:space-between;padding-top:16px}
.hero-n{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:14px 0 8px}[dir=rtl] .hero-n{line-height:1.4;letter-spacing:0}
.loc{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:15px}
.field{width:100%;height:52px;border-radius:18px;background:var(--sec);border:0;padding:0 16px;font-size:15px;transition:background .15s}
.field::placeholder{color:#7C8E87}.field:focus{background:#fff;box-shadow:0 0 0 3px rgba(1,190,132,.35);outline:0}
.lab{display:block;font-size:13px;font-weight:700;margin:20px 0 8px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.sel{position:relative}.sel .tick{position:absolute;inset-inline-end:14px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center}
.pcard{outline:0}.pcard[aria-checked=true]{background:#F1FAF6;box-shadow:0 0 0 2px var(--emerald),var(--shadow)}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qt{border-radius:26px;background:var(--card);box-shadow:var(--shadow);padding:16px;min-height:132px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,color .15s}
.qt[aria-pressed=true]{background:var(--forest);color:#fff}.qt b{font-size:15px;font-weight:500}.qt .n{font-size:30px;font-weight:700;letter-spacing:-.02em}.qt small{display:block;font-size:11px;opacity:.65;margin-top:2px}

.nav button{flex:1;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-weight:700;font-size:14px;transition:background .2s,flex .2s}

.sheet h2{font-size:22px;margin:0 0 4px}.sheet .sub{color:var(--mute);font-size:14px;margin:0 0 16px}

.code{text-align:center;font-weight:700;font-size:22px;letter-spacing:.08em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:min(calc(100% - 32px),398px);background:var(--forest);color:#fff;padding:13px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;box-shadow:0 12px 30px rgba(3,68,45,.35);animation:up .25s}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    h += '<span class="lab">' + t('f_days') + '</span><div class="chips">' + [3, 5, 7, 10, 14].map(function (d) { return '<button class="chip" data-act="fdays" data-v="' + d + '" aria-pressed="' + (f.days === d) + '">' + d + ' ' + t('days') + '</button>'; }).join('') + '</div>';
    h += '<span class="lab">' + t('f_time') + '</span><div class="chips">' + ['morning', 'noon', 'evening'].map(function (k) { return '<button class="chip" data-act="ftime" data-v="' + k + '" aria-pressed="' + (f.time === k) + '">' + t(k) + '</button>'; }).join('') + '</div>';
    h += '<label class="lab" for="f-notes">' + t('f_notes') + '</label><input class="field" id="f-notes" placeholder="' + t('f_notes_ph') + '" value="' + esc(f.notes) + '" autocomplete="off">';
    h += '<div class="row2 mt2"><button class="btn s" data-act="draft">' + t('draft') + '</button><button class="btn p f2" data-act="sendrx">' + t('send_ph') + '</button></div>';
    return h;
  }

  /* ---------- sheets ---------- */
  function qrSvg(seed) {
    var n = 25, h = 0, i, x, y, s = '';
    for (i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    function rnd() { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }
    function finder(fx, fy) { return x >= fx && x < fx + 7 && y >= fy && y < fy + 7; }
    for (y = 0; y < n; y++) for (x = 0; x < n; x++) {
      var on;
      if (finder(0, 0) || finder(n - 7, 0) || finder(0, n - 7)) {
        var fx = x < 7 ? 0 : n - 7, fy = y < 7 ? 0 : n - 7, dx = x - fx, dy = y - fy;
        on = dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
      } else if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) on = false; else on = rnd() > .52;
      if (on) s += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02"/>';
    }
    return '<svg class="qr" viewBox="0 0 ' + n + ' ' + n + '" fill="#090E0E" role="img" aria-label="' + t('sample') + '">' + s + '</svg>';
  }
  function sheetHtml() {
    var h = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>';
    if (st.sheet === 'code') {
      var r = rx(st.rx === 'rx2' || st.rx === 'rx3' ? st.rx : 'rx1');
      h += '<h2>' + t('code_t') + '</h2><p class="sub">' + t('code_s') + '</p>' + qrSvg(r.code) + '<div class="code">' + r.code + '</div><p class="eyebrow" style="text-align:center;margin:0 0 18px">' + t('sample') + ' · ' + L(D.meds[r.med]) + (st.reserved ? ' · ' + st.reserved : '') + '</p><div class="row2"><button class="btn s" data-act="share">' + t('share') + '</button><button class="btn p" data-act="close">' + t('done') + '</button></div>';
    } else if (st.sheet === 'scan') {
      h += '<h2>' + t('scan') + '</h2><p class="sub">' + t('code_s') + '</p><input class="field" id="scan-in" placeholder="RS-20418" value="' + esc(st.scan) + '" autocomplete="off" aria-label="' + t('code_ph') + '">';
      if (st.scanRes === 'ok') h += '<div class="invite" style="margin-top:14px"><div><b>' + t('match') + '</b><p>Noura Al-Qahtani · ' + L(D.meds.amox) + '<br>' + t('dispense') + '</p></div></div>';
      if (st.scanRes === 'no') h += '<div class="err" role="alert">' + t('no_match') + '</div>';
      h += '<div class="row2 mt"><button class="btn s" data-act="close">' + t('done') + '</button><button class="btn p f2" data-act="verify">' + t('verify') + '</button></div>';
    } else if (st.sheet === 'sent') {
      h += '<div class="invite" style="background:#E3F5EE;margin-bottom:16px"><div class="glyph" style="transform:none;width:54px;height:54px;border-radius:18px">' + ic('check', 26) + '</div><div><h2 style="margin:0">' + t('sent_t') + '</h2></div></div><p class="sub">' + t('sent_s') + '</p><div class="row2"><button class="btn s" data-act="another">' + t('another') + '</button><button class="btn p f2" data-act="tohome">' + t('back_dash') + '</button></div>';
    }
    return h + '</div>';
  }

  /* ---------- shell ---------- */
  function navItems() {
    return st.role === 'patient'
      ? [['home', 'home', 'nav_home'], ['rx', 'rx', 'nav_rx'], ['pharm', 'pin', 'nav_ph'], ['me', 'user', 'nav_me']]
      : [['dash', 'home', 'nav_dash'], ['cq', 'rx', 'nav_q'], ['new', 'plus', 'nav_new'], ['me', 'user', 'nav_me']];
  }
  function routeHtml() {
    var r = st.route;
    if (st.role === 'patient') return r === 'home' ? homeP() : r === 'rx' ? rxList() : r === 'detail' ? detail() : r === 'pharm' ? pharm() : me();
    return r === 'dash' ? dash() : r === 'cq' ? queue() : r === 'new' ? form() : me();
  }
  function render(keepScroll) {
    var y = window.scrollY, a = document.getElementById('app');
    a.setAttribute('dir', st.lang === 'ar' ? 'rtl' : 'ltr'); a.setAttribute('lang', st.lang);
    var proto = '<div class="proto"><span>' + t('proto') + '</span><span class="seg2" role="group" aria-label="' + t('viewas') + '"><button data-act="role" data-v="patient" aria-pressed="' + (st.role === 'patient') + '">' + t('patient') + '</button><button data-act="role" data-v="clinic" aria-pressed="' + (st.role === 'clinic') + '">' + t('clinic') + '</button></span><span class="seg2" role="group" aria-label="' + t('lang') + '"><button data-act="lang" data-v="en" aria-pressed="' + (st.lang === 'en') + '">EN</button><button data-act="lang" data-v="ar" aria-pressed="' + (st.lang === 'ar') + '">ع</button></span></div>';
    var items = navItems(), cur = st.route === 'detail' ? 'rx' : st.route;
    var nav = '<nav class="nav" aria-label="Main">' + items.map(function (i) { return '<button data-go="' + i[0] + '" aria-label="' + t(i[2]) + '"' + (cur === i[0] ? ' aria-current="page"' : '') + '>' + ic(i[1], 21) + '<span>' + t(i[2]) + '</span></button>'; }).join('') + '</nav>';
    a.innerHTML = proto + routeHtml() + nav;
    document.getElementById('layer').innerHTML = (st.sheet ? sheetHtml() : '') + (st.toast ? '<div class="toast" role="status">' + esc(st.toast) + '</div>' : '');
    window.scrollTo(0, keepScroll ? y : 0);
  }
  var tt;
  function toast(m) { st.toast = m; clearTimeout(tt); tt = setTimeout(function () { st.toast = ''; var l = document.getElementById('layer'); var el = l.querySelector('.toast'); if (el) el.remove(); }, 2400); }
  function link() { var r = rx(st.rx); return 'rushta.example/r/' + r.code; }
  function copy() {
    var u = 'https://' + link();
    try { navigator.clipboard.writeText(u).then(function () { toast(t('copied')); render(true); }, function () { toast(t('copy_fail') + rx(st.rx).code); render(true); }); }
    catch (e) { toast(t('copy_fail') + rx(st.rx).code); render(true); }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-act]'); if (!el) return;
    var go = el.getAttribute('data-go'), act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
    if (go) { if (id) st.rx = id; st.route = go; st.sheet = ''; return render(); }
    if (act === 'close') { st.sheet = ''; st.scanRes = ''; return render(true); }
    if (act === 'lang') { st.lang = v; save(); return render(true); }
    if (act === 'role') { st.role = v; st.route = v === 'clinic' ? 'dash' : 'home'; st.sheet = ''; save(); return render(); }
    if (act === 'filter') { st.filter = v; return render(true); }
    if (act === 'slot') { st.slot = v; return render(true); }
    if (act === 'reserve') { if (!st.slot) { toast(t('slot_pick')); return render(true); } st.reserved = st.slot + (st.lang === 'ar' ? ' يوم الأربعاء' : ' on Wed 14 May'); toast(t('reserved') + ' ' + st.slot); return render(true); }
    if (act === 'code') { st.sheet = 'code'; return render(true); }
    if (act === 'share') return copy();
    if (act === 'phf') { st.phf = st.phf === v ? '' : v; return render(true); }
    if (act === 'pickph') { st.ph = id; toast(t('pharm_set')); return render(true); }
    if (act === 'qf') { st.qf = v; return render(true); }
    if (act === 'scan') { st.sheet = 'scan'; st.scanRes = ''; return render(true); }
    if (act === 'verify') { var inp = document.getElementById('scan-in'); st.scan = inp ? inp.value.trim().toUpperCase() : ''; st.scanRes = st.scan === 'RS-20418' ? 'ok' : 'no'; return render(true); }
    if (act === 'sendq') { toast(t('sent_t')); return render(true); }
    if (act === 'fpat') { st.form.patient = v; return render(true); }
    if (act === 'fdays') { st.form.days = +v; return render(true); }
    if (act === 'ftime') { st.form.time = v; return render(true); }
    if (act === 'draft') { toast(t('saved')); return render(true); }
    if (act === 'sendrx') {
      var m = document.getElementById('f-med'); st.form.med = m ? m.value.trim() : st.form.med; st.form.dose = (document.getElementById('f-dose') || {}).value || ''; st.form.notes = (document.getElementById('f-notes') || {}).value || '';
      if (!st.form.med) { st.form.err = true; render(true); var f = document.getElementById('f-med'); if (f) f.focus(); return; }
      st.form.err = false; st.count += 1; st.recent.unshift({ p: st.form.patient, m: 'amox', s: 'preparing' }); st.sheet = 'sent'; return render(true);
    }
    if (act === 'another') { st.form = { patient: 'p3', med: '', dose: '', days: 7, time: 'morning', notes: '', err: false }; st.sheet = ''; st.route = 'new'; return render(); }
    if (act === 'tohome') { st.form = { patient: 'p3', med: '', dose: '', days: 7, time: 'morning', notes: '', err: false }; st.sheet = ''; st.route = 'dash'; return render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'phq') { st.phq = e.target.value; var l = document.getElementById('phlist'); if (l) l.innerHTML = pharmList(); }
    if (e.target.id === 'f-med') { st.form.med = e.target.value; }
    if (e.target.id === 'f-dose') { st.form.dose = e.target.value; }
    if (e.target.id === 'f-notes') { st.form.notes = e.target.value; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.sheet) { st.sheet = ''; render(true); } });
  render();
})();
</script></body></html>
